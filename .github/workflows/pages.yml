name: Deploy Petri Net Editor to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Browser-Petri-Net-Editor
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: petri-net-app/package-lock.json

      - name: Install dependencies
        working-directory: petri-net-app
        run: npm ci

      # The PT symbolic-execution engine bundle is vendored in the repo at
      # petri-net-app/public/py/symex_engine_pt.zip and served from Vite's
      # public dir, so the build no longer depends on an external repo checkout.
      - name: Build
        working-directory: petri-net-app
        run: npx vite build --outDir dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: petri-net-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

